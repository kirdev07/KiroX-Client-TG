name: Android build

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The release key and Telegram API keys are not in the repository; the debug build runs without them.
      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest 2>&1 | tee -a build.log

      - name: Debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebug 2>&1 | tee -a build.log

      # Compiler errors and failed tests as annotations, readable without the full log.
      - name: Report errors
        if: failure()
        run: |
          grep -E '^e: |error:|FAILED|What went wrong' -A3 build.log | head -60 | while IFS= read -r line; do
            echo "::error title=build::${line//%/%25}"
          done
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            grep -o '<testcase name="[^"]*" classname="[^"]*"[^>]*>[[:space:]]*<failure message="[^"]*"' "$f" | head -20 | while IFS= read -r line; do
              echo "::error title=test::${line//%/%25}"
            done
          done

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kirox-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 14
