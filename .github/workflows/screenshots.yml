# Renders the main screens with sample data (ScreenshotTest, Robolectric) and puts the PNG files on
# the "screenshots" branch, so they can be looked at without a device.
name: Screenshots

on:
  push:
    branches: [main, "feature/**", "fix/**"]
    paths: [.github/workflows/screenshots.yml, app/src/test/java/com/kirox/app/screenshots/**, screenshots.request]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Render
        env:
          KIROX_SCREENSHOTS: "true"
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests "com.kirox.app.screenshots.*" 2>&1 | tee render.log

      - name: Report failures
        if: always()
        run: |
          for f in app/build/test-results/testDebugUnitTest/TEST-com.kirox.app.screenshots*.xml; do
            [ -f "$f" ] || continue
            grep -o '<testcase name="[^"]*"[^>]*>\s*<failure message="[^"]\{0,300\}' "$f" | sed 's/<testcase name="\([^"]*\)".*message="/\1: /' | while IFS= read -r line; do echo "::error title=screenshot::${line//%/%25}"; done
          done
          grep -E '^e: |FAILED|What went wrong' render.log | head -20 | while IFS= read -r line; do echo "::error title=build::${line//%/%25}"; done
          ls -la app/build/screenshots || true

      - name: Publish to the screenshots branch
        run: |
          [ -d app/build/screenshots ] || exit 0
          mkdir /tmp/shots && cp app/build/screenshots/*.png /tmp/shots/
          cd /tmp/shots
          git init -q && git checkout -q -b screenshots
          git config user.name "Claude" && git config user.email "noreply@anthropic.com"
          git add . && git commit -q -m "Screenshots of ${GITHUB_SHA:0:8}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
